<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Solutions Consulting</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f4f4; /* Light grey background */
            color: #333; /* Dark grey text */
            scroll-behavior: smooth;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: #FBC31A;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #555; /* Medium grey on hover */
        }

        header {
            background: linear-gradient(135deg, #000000, #333); /* Black to dark grey */
            color: #FBC31A;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header h1 {
            font-size: 2.53125em;
            font-weight: 700;
            margin-bottom: 20px;
            animation: fadeIn 1.5s ease-in-out;
        }

        header p {
            font-size: 1.2em;
            font-weight: 300;
            margin-bottom: 40px;
            color: #ccc; /* Light grey */
            animation: fadeIn 2s ease-in-out;
        }

        header button {
            background-color: #FBC31A;
            color: #000000;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            font-size: 1.2em;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        header button:hover {
            background-color: #555;
            color: #FBC31A; /* Yellow on hover */
        }

        header::before {
            content: "";
            position: absolute;
            background-image: url('https://source.unsplash.com/random/1920x1080');
            background-size: cover;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.3;
        }

        section {
            padding: 100px 20px;
            position: relative;
            transition: padding 0.3s ease-in-out;
        }

        section h2 {
            text-align: center;
            font-size: 1.6875em;
            margin-bottom: 40px;
            font-weight: 600;
            position: relative;
            color: #000000;
        }

        h2::after {
            content: '';
            width: 70px;
            height: 4px;
            background-color: #FBC31A;
            display: block;
            margin: 10px auto;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .service-item {
            background-color: #e9e9e9; /* Light grey */
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s ease-in-out;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(100px);
            animation: fadeInUp 0.6s forwards;
        }

        .service-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .service-item h4 {
            margin-bottom: 15px;
            font-size: 1.0125em;
            color: #000000; /* Black */
        }

        .service-item p {
            font-size: 0.8em;
            color: #555; /* Medium grey */
        }

        #sectors {
            background: linear-gradient(135deg, #333, #555); /* Dark to medium grey */
            color: #ffffff;
            padding: 80px 0;
        }

        .sector-item {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 10px;
            color: #fff;
        }

        .sector-item h4 {
            margin-bottom: 10px;
            font-size: 1.0125em;
            color: #FBC31A; /* Yellow */
        }

        #case-studies {
            background-color: #f0f0f0; /* Very light grey */
        }

        .case-study {
            background-color: #ffffff; /* White */
            width: 48%;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .case-study:hover {
            transform: scale(1.05);
        }

        .case-study h3 {
            font-size: 1.0125em;
            margin-bottom: 10px;
            color: #000000;
        }

        .case-study p {
            font-size: 1.2em;
            color: #555;
        }

        #testimonials {
            background: linear-gradient(135deg, #333, #555); /* Dark grey gradient */
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        footer {
            background-color: #333; /* Dark grey */
            color: #FBC31A; /* Yellow */
            padding: 50px 20px;
            text-align: center;
        }

        footer a {
            color: #FBC31A;
            margin: 0 10px;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: #fff;
        }
    </style>
</head>
